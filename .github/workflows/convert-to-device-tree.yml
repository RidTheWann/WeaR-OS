name: Convert WeaR OS to duchamp device tree

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip after conversion
        shell: bash
        run: |
          set -euo pipefail
          if [[ "\${{ github.event.head_commit.message }}" == *"chore: establish duchamp device tree"* ]]; then
            echo "Device-tree conversion already completed."
            exit 0
          fi

      - name: Checkout WeaR OS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import Snapboss reference tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/snapboss-duchamp
          git clone --quiet --no-tags \
            https://github.com/snapboss/device_xiaomi_duchamp.git \
            /tmp/snapboss-duchamp
          cd /tmp/snapboss-duchamp
          git checkout --quiet 50f301982df14af45af137ba87c565a459a7e65c
          cd "\$GITHUB_WORKSPACE"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -a /tmp/snapboss-duchamp/. .

      - name: Create WeaR product and documentation
        shell: bash
        run: |
          set -euo pipefail

          cat > wear_duchamp.mk <<'EOF'
# SPDX-License-Identifier: Apache-2.0
#
# WeaR OS product for Xiaomi/POCO duchamp.

$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit_only.mk)
$(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)

WITH_GMS := true

$(call inherit-product, device/xiaomi/duchamp/device.mk)
$(call inherit-product, vendor/lineage/config/common_full_phone.mk)

TARGET_ENABLE_BLUR := true

PRODUCT_NAME := wear_duchamp
PRODUCT_DEVICE := duchamp
PRODUCT_MANUFACTURER := Xiaomi
PRODUCT_BRAND := POCO
PRODUCT_MODEL := 2311DRK48G
PRODUCT_SYSTEM_NAME := duchamp_global
PRODUCT_CHARACTERISTICS := nosdcard
PRODUCT_GMS_CLIENTID_BASE := android-xiaomi

PRODUCT_BUILD_PROP_OVERRIDES += \
    BuildDesc="missi-user 16 BP3A.250905.031.A3 OS2.0.206.0.VNLMIXM release-keys" \
    BuildFingerprint=POCO/duchamp_global/duchamp:14/UP1A.230905.011/OS2.0.206.0.VNLMIXM:user/release-keys \
    DeviceProduct=$(PRODUCT_SYSTEM_NAME)

WEAR_OS_NAME := WeaR OS
WEAR_OS_VERSION := 0.1.0-alpha1
WEAR_OS_BUILD_TYPE := UNOFFICIAL
WEAR_OS_DEVICE := duchamp

PRODUCT_SYSTEM_PROPERTIES += \
    ro.wearos.name=WeaR_OS \
    ro.wearos.version=$(WEAR_OS_VERSION) \
    ro.wearos.build_type=$(WEAR_OS_BUILD_TYPE)
EOF

          cat > AndroidProducts.mk <<'EOF'
# SPDX-License-Identifier: Apache-2.0
#

PRODUCT_MAKEFILES := \
    $(LOCAL_DIR)/wear_duchamp.mk

COMMON_LUNCH_CHOICES := \
    wear_duchamp-userdebug
EOF

          mkdir -p docs
          cat > README.md <<'EOF'
# WeaR OS - Xiaomi/POCO duchamp

Custom Android ROM device tree for POCO X6 Pro 5G / Redmi K70E (duchamp).

This repository is the actual device/xiaomi/duchamp tree used by the Android
build. It is not a vendor wrapper and it does not contain an AOSP checkout.

Hardware baseline:
https://github.com/snapboss/device_xiaomi_duchamp
Reference commit:
50f301982df14af45af137ba87c565a459a7e65c

The device tree contains board configuration, kernel integration, VINTF/HAL
declarations, overlays, sepolicy, rootdir, power/thermal configuration,
UDFPS, native shims, device parts and extraction manifests.

WeaR-specific product identity lives in wear_duchamp.mk.
EOF

          cat > docs/source-reference.md <<'EOF'
# Source Reference

## Authoritative hardware baseline

Repository:
https://github.com/snapboss/device_xiaomi_duchamp

Pinned reference:
50f301982df14af45af137ba87c565a459a7e65c

## Engineering reference

Repository:
https://github.com/Saikrishna1504/device_xiaomi_duchamp

The Saikrishna tree is a LineageOS-style duchamp implementation and a useful
reference for device-side engineering patterns. WeaR OS does not copy its ROM
branding or Axion-specific layer wholesale.

Hardware-specific code stays inside the device tree. WeaR framework features
are introduced separately at the correct ownership boundary.
EOF

          cat > docs/device-tree.md <<'EOF'
# Device Tree Layout

BoardConfig.mk
: board, kernel, partition, AVB and platform configuration.

device.mk
: device packages, HALs, permissions, overlays and runtime configuration.

wear_duchamp.mk
: WeaR OS product definition and ROM identity.

AndroidProducts.mk
: product and lunch registration.

manifest.xml and compatibility matrices
: VINTF declarations.

configs/, overlay/, overlay-lineage/, rootdir/, sepolicy/
: hardware-specific runtime resources and policy.

libshims/, udfps/, power/, parts/
: native and device feature implementations.

proprietary-files.txt and proprietary-firmware.txt
: extraction manifests only. Proprietary payloads stay outside this repository.
EOF

      - name: Install CI validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/validate.yml <<'EOF'
name: WeaR duchamp device-tree validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate Python
        run: python3 -m py_compile extract-files.py setup-makefiles.py

      - name: Validate XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path(".").rglob("*.xml"):
              ET.parse(path)
          print("XML validation passed.")
          PY

      - name: Validate device-tree anchors
        shell: bash
        run: |
          set -euo pipefail
          for f in Android.bp AndroidProducts.mk BoardConfig.mk device.mk \
                   wear_duchamp.mk manifest.xml compatibility_matrix.xml \
                   framework_compatibility_matrix.xml proprietary-files.txt \
                   proprietary-firmware.txt; do
            test -f "$f"
          done

          grep -q 'PRODUCT_NAME := wear_duchamp' wear_duchamp.mk
          grep -q 'wear_duchamp-userdebug' AndroidProducts.mk
          grep -q 'TARGET_BOARD_PLATFORM := mt6897' BoardConfig.mk
          grep -q 'KERNEL_PATH := $(DEVICE_PATH)-kernel' BoardConfig.mk
          grep -q 'vendor/xiaomi/duchamp/duchamp-vendor.mk' device.mk

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \
              \( -name '*.img' -o -name '*.so' -o -name '*.apk' \) \
              -not -path './.git/*' | grep -q .; then
            echo "Unexpected generated/proprietary artifact found."
            exit 1
          fi
EOF

      - name: Finalize and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/convert-to-device-tree.yml
          git add -A
          git commit -m "chore: establish duchamp device tree (Snapboss 50f3019)"
          git push origin HEAD:main
