name: WeaR OS validation

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate repository
        run: bash scripts/validate.sh

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          EXPECTED="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

          curl -fsSL "$URL" -o "/tmp/$ARCHIVE"
          echo "$EXPECTED  /tmp/$ARCHIVE" | sha256sum -c -
          tar -xzf "/tmp/$ARCHIVE" -C /tmp
          install -m 0755 /tmp/actionlint "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" -version

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -color
