name: WeaR duchamp device-tree validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python extraction helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile extract-files.py setup-makefiles.py

      - name: Validate XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          failures = 0
          for path in sorted(Path(".").rglob("*.xml")):
              try:
                  ET.parse(path)
                  print(f"OK  {path}")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failures += 1

          if failures:
              raise SystemExit(f"{failures} XML file(s) failed to parse")
          PY

      - name: Validate device-tree anchors
        shell: bash
        run: |
          set -euo pipefail

          for f in               Android.bp               AndroidProducts.mk               BoardConfig.mk               device.mk               wear_duchamp.mk               manifest.xml               compatibility_matrix.xml               framework_compatibility_matrix.xml               proprietary-files.txt               proprietary-firmware.txt; do
            test -f "$f"
          done

          grep -q 'PRODUCT_NAME := wear_duchamp' wear_duchamp.mk
          grep -q 'wear_duchamp-userdebug' AndroidProducts.mk
          grep -q 'TARGET_BOARD_PLATFORM := mt6897' BoardConfig.mk
          grep -q 'KERNEL_PATH := $(DEVICE_PATH)-kernel' BoardConfig.mk
          grep -q 'vendor/xiaomi/duchamp/duchamp-vendor.mk' device.mk
          grep -q '50f301982df14af45af137ba87c565a459a7e65c' README.md

      - name: Validate ROM build workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/rom-build.yml
          backslash="$(printf '\x5c')"
          dollar="$(printf '\x24')"
          forbidden="${backslash}${dollar}{{"
          ! grep -R -n -F "$forbidden" .github/workflows
          expected_lunch=$(printf '%s' 'lunch "wear_duchamp-${BUILD_TYPE}"')
          grep -q -F "$expected_lunch" .github/workflows/rom-build.yml
      - name: Validate duchamp integration invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'BuildDesc="missi-user 15 AP3A.240905.015.A2 OS2.0.206.0.VNLMIXM release-keys"' lineage_duchamp.mk
          grep -q 'BuildFingerprint=POCO/duchamp_global/duchamp:15/AP3A.240905.015.A2/OS2.0.206.0.VNLMIXM:user/release-keys' lineage_duchamp.mk
          ! grep -q 'LUMINE_MAINTAINER := Luxured' lineage_duchamp.mk
          ! grep -q 'TARGET_ENABLE_BLUR := true' lineage_duchamp.mk

          python3 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("extract-files.py").read_text(encoding="utf-8"))
          blob_dict = next(
              (
                  node.value
                  for node in tree.body
                  if isinstance(node, ast.AnnAssign)
                  and isinstance(node.target, ast.Name)
                  and node.target.id == "blob_fixups"
              ),
              None,
          )
          if not isinstance(blob_dict, ast.Dict):
              raise SystemExit("blob_fixups dictionary not found")

          def literal(node):
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return ("str", node.value)
              if isinstance(node, ast.Tuple):
                  values = []
                  for item in node.elts:
                      value = literal(item)
                      if value is None:
                          return None
                      values.append(value)
                  return ("tuple", tuple(values))
              return None

          seen = set()
          for key in blob_dict.keys:
              value = literal(key)
              if value is not None and value in seen:
                  raise SystemExit(f"Duplicate blob_fixups key: {value!r}")
              if value is not None:
                  seen.add(value)

          print("blob_fixups contains no duplicate literal keys.")
          PY

          test "$(grep -c "libmtkcam_hwnode.jpegnode.so': blob_fixup" extract-files.py)" -eq 1
          grep -A2 "libmtkcam_hwnode.jpegnode.so': blob_fixup" extract-files.py | grep -q "add_needed('libultrahdr_shim.so')"
          grep -A2 "libmtkcam_hwnode.jpegnode.so': blob_fixup" extract-files.py | grep -q "replace_needed('libultrahdr.so', 'libultrahdr-v34.so')"

          ! grep -Fq '/devices/system/cpu/cpu[0-7]/online' sepolicy/vendor/genfs_contexts
          for cpu in 0 1 2 3 4 5 6 7; do
            grep -q "/devices/system/cpu/cpu${cpu}/online" sepolicy/vendor/genfs_contexts
          done

          test "$(grep -c 'startServiceAsUser.*TouchSamplingService.class' parts/src/org/lineageos/settings/BootCompletedReceiver.java)" -eq 1

          ! grep -q 'android:permission="RefreshService"' parts/AndroidManifest.xml
          ! grep -q 'android:permission="ColorModeService"' parts/AndroidManifest.xml
          ! grep -q 'android:permission="PocketService"' parts/AndroidManifest.xml
          ! grep -q 'android:permission="TurboChargingService"' parts/AndroidManifest.xml

          grep -q 'android:priority="101"' overlay/SettingsProviderOverlayDuchampRedmi/AndroidManifest.xml
          grep -q 'package="com.android.phone.overlay.duchamp"' overlay/TelephonyResOverlayDuchamp/AndroidManifest.xml

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f               \( -name '*.img' -o -name '*.apk' -o -name '*.so' \)               -not -path './.git/*' | grep -q .; then
            echo "Unexpected generated/proprietary binary found in device tree." >&2
            exit 1
          fi

          test ! -d products
          test ! -d manifests
          test ! -d scripts
