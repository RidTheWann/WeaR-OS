name: WeaR duchamp device-tree validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python extraction helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile extract-files.py setup-makefiles.py

      - name: Validate XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          failures = 0
          for path in sorted(Path(".").rglob("*.xml")):
              try:
                  ET.parse(path)
                  print(f"OK  {path}")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failures += 1

          if failures:
              raise SystemExit(f"{failures} XML file(s) failed to parse")
          PY

      - name: Validate device-tree anchors
        shell: bash
        run: |
          set -euo pipefail

          for f in               Android.bp               AndroidProducts.mk               BoardConfig.mk               device.mk               wear_duchamp.mk               manifest.xml               compatibility_matrix.xml               framework_compatibility_matrix.xml               proprietary-files.txt               proprietary-firmware.txt; do
            test -f "$f"
          done

          grep -q 'PRODUCT_NAME := wear_duchamp' wear_duchamp.mk
          grep -q 'wear_duchamp-userdebug' AndroidProducts.mk
          grep -q 'TARGET_BOARD_PLATFORM := mt6897' BoardConfig.mk
          grep -q 'KERNEL_PATH := $(DEVICE_PATH)-kernel' BoardConfig.mk
          grep -q 'vendor/xiaomi/duchamp/duchamp-vendor.mk' device.mk
          grep -q '50f301982df14af45af137ba87c565a459a7e65c' README.md

      - name: Validate ROM build workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/rom-build.yml
          backslash="$(printf '\x5c')"
          dollar="$(printf '\x24')"
          forbidden="${backslash}${dollar}{{"
          ! grep -R -n -F "$forbidden" .github/workflows
          expected_lunch=$(printf '%s' 'lunch "wear_duchamp-${BUILD_TYPE}"')
          grep -q -F "$expected_lunch" .github/workflows/rom-build.yml
          grep -q -F 'get_build_var BOARD_SYSTEMIMAGE_FILE_SYSTEM_TYPE' .github/workflows/rom-build.yml
          grep -q -F 'm nothing' .github/workflows/rom-build.yml
          grep -q -F 'm selinux_policy' .github/workflows/rom-build.yml
          grep -q -F 'm check-vintf-all' .github/workflows/rom-build.yml
          grep -q -F 'mka bacon' .github/workflows/rom-build.yml
          grep -q -F '<remote name="external_github" fetch="https://github.com/"/>' .github/workflows/rom-build.yml
          grep -q -F '<remove-project name="LineageOS/android_hardware_lineage_interfaces"/>' .github/workflows/rom-build.yml
          grep -q -F '<remove-project name="LineageOS/android_packages_apps_Aperture"/>' .github/workflows/rom-build.yml
          grep -q -F '<remove-project name="LineageOS/android_vendor_qcom_opensource_vibrator"/>' .github/workflows/rom-build.yml
          grep -q -F 'echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"' .github/workflows/rom-build.yml
          grep -q -F 'echo "USE_CCACHE=$USE_CCACHE" >> "$GITHUB_ENV"' .github/workflows/rom-build.yml
          grep -q -F 'echo "CCACHE_EXEC=$CCACHE_EXEC" >> "$GITHUB_ENV"' .github/workflows/rom-build.yml

          python3 - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/rom-build.yml").read_text(encoding="utf-8")
          steps = {}
          current = None
          for line in text.splitlines():
              if line.startswith("      - name: "):
                  current = line[len("      - name: "): ]
                  steps[current] = []
              elif current is not None:
                  steps[current].append(line)

          required = {
              "Soong analysis": "m nothing -j\"$JOBS\"",
              "SELinux policy": "m selinux_policy -j\"$JOBS\"",
              "VINTF validation": "m check-vintf-all -j\"$JOBS\"",
              "Build OTA": "mka bacon -j\"$JOBS\"",
          }
          for name, command in required.items():
              block = "\n".join(steps.get(name, []))
              if not block:
                  raise SystemExit(f"missing workflow step: {name}")
              for snippet in (
                  "BUILD_TYPE:",
                  "inputs.build_type",
                  'cd "$ANDROID_DIR"',
                  'set +u',
                  'source build/envsetup.sh',
                  'lunch "wear_duchamp-${BUILD_TYPE}"',
                  'set -u',
                  command,
              ):
                  if snippet not in block:
                      raise SystemExit(f"{name}: missing {snippet!r}")
          print("ROM build shell reinitialization guards passed.")
          PY
      - name: Validate duchamp integration invariants
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re

          lineage = Path("lineage_duchamp.mk").read_text(encoding="utf-8")
          proprietary = Path("proprietary-files.txt").read_text(encoding="utf-8")
          wear = Path("wear_duchamp.mk").read_text(encoding="utf-8")

          desc = re.search(
              r'BuildDesc="(?P<product>[^"\s]+)-user\s+'
              r'(?P<release>[0-9]+)\s+(?P<build_id>[^\s]+)\s+'
              r'(?P<incremental>[^\s]+)\s+release-keys"',
              lineage,
          )
          fingerprint = re.search(
              r'BuildFingerprint=[^/\s]+/(?P<product>[^/\s]+)/[^:]+:'
              r'(?P<release>[0-9]+)/(?P<build_id>[^/]+)/'
              r'(?P<incremental>[^:]+):user/release-keys',
              lineage,
          )
          header = re.search(
              r'^# Unpinned blobs from (?P<product>[^\s]+)-user\s+'
              r'(?P<release>[0-9]+)\s+(?P<build_id>[^\s]+)\s+'
              r'(?P<incremental>[^\s]+)\s+release-keys',
              proprietary,
              re.MULTILINE,
          )

          if not desc:
              raise SystemExit("BuildDesc stock identity not found")
          if not fingerprint:
              raise SystemExit("BuildFingerprint stock identity not found")
          if not header:
              raise SystemExit("proprietary-files.txt stock identity header not found")

          desc_tuple = tuple(desc.group(k) for k in ("release", "build_id", "incremental"))
          fp_tuple = tuple(fingerprint.group(k) for k in ("release", "build_id", "incremental"))
          header_tuple = tuple(header.group(k) for k in ("release", "build_id", "incremental"))
          if desc_tuple != fp_tuple or desc_tuple != header_tuple:
              raise SystemExit(
                  "stock identity mismatch: "
                  f"BuildDesc={desc_tuple}, BuildFingerprint={fp_tuple}, "
                  f"proprietary-files.txt={header_tuple}"
              )

          if desc.group("product") != fingerprint.group("product"):
              raise SystemExit(
                  "product mismatch: "
                  f"BuildDesc={desc.group('product')}, "
                  f"BuildFingerprint={fingerprint.group('product')}"
              )

          if "LUMINE_MAINTAINER :=" in lineage or "TARGET_ENABLE_BLUR := true" in lineage:
              raise SystemExit("stale LumineDroid configuration remains in lineage_duchamp.mk")
          if "LUMINE_MAINTAINER" in wear:
              raise SystemExit("stale LumineDroid maintainer variable remains in wear_duchamp.mk")
          for stale in ("WEAR_OS_NAME :=", "WEAR_OS_DEVICE :="):
              if stale in wear:
                  raise SystemExit(f"unused product variable remains in wear_duchamp.mk: {stale}")

          extract = Path("extract-files.py").read_text(encoding="utf-8")
          if "libmtkcam_hwnode.jpegnode.so': blob_fixup" not in extract:
              raise SystemExit("jpegnode blob fixup missing")
          if "add_needed('libultrahdr_shim.so')" not in extract:
              raise SystemExit("jpegnode UltraHDR shim fixup missing")
          if "replace_needed('libultrahdr.so', 'libultrahdr-v34.so')" not in extract:
              raise SystemExit("jpegnode UltraHDR SONAME fixup missing")

          genfs = Path("sepolicy/vendor/genfs_contexts").read_text(encoding="utf-8")
          if "/devices/system/cpu/cpu[0-7]/online" in genfs:
              raise SystemExit("invalid cpu[0-7] genfscon pattern remains")
          for cpu in range(8):
              if f"/devices/system/cpu/cpu{cpu}/online" not in genfs:
                  raise SystemExit(f"missing cpu{cpu}/online genfscon label")

          receiver = Path("parts/src/org/lineageos/settings/BootCompletedReceiver.java").read_text(encoding="utf-8")
          starts = re.findall(
              r'startServiceAsUser\(touchSamplingServiceIntent,\s*UserHandle\.CURRENT\)',
              receiver,
          )
          if len(starts) != 1:
              raise SystemExit(f"expected exactly one TouchSamplingService launch, found {len(starts)}")
          if "new Intent(context, TouchSamplingService.class)" not in receiver:
              raise SystemExit("TouchSamplingService Intent construction missing")

          manifest = Path("parts/AndroidManifest.xml").read_text(encoding="utf-8")
          for permission in ("RefreshService", "ColorModeService", "PocketService", "TurboChargingService"):
              if f'android:permission="{permission}"' in manifest:
                  raise SystemExit(f"undefined service permission remains: {permission}")

          telephony = Path("overlay/TelephonyResOverlayDuchamp/AndroidManifest.xml").read_text(encoding="utf-8")
          if "pissarro" in telephony:
              raise SystemExit("wrong pissarro telephony package remains")
          if 'package="com.android.phone.overlay.duchamp"' not in telephony:
              raise SystemExit("duchamp telephony package missing")

          redmi = Path("overlay/SettingsProviderOverlayDuchampRedmi/AndroidManifest.xml").read_text(encoding="utf-8")
          if 'android:priority="101"' not in redmi:
              raise SystemExit("CN SettingsProvider overlay priority is not deterministic")

          tree = ast.parse(extract)
          blob_dict = next(
              (
                  node.value
                  for node in tree.body
                  if isinstance(node, ast.AnnAssign)
                  and isinstance(node.target, ast.Name)
                  and node.target.id == "blob_fixups"
              ),
              None,
          )
          if not isinstance(blob_dict, ast.Dict):
              raise SystemExit("blob_fixups dictionary not found")

          def literal(node):
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return ("str", node.value)
              if isinstance(node, ast.Tuple):
                  values = []
                  for item in node.elts:
                      value = literal(item)
                      if value is None:
                          return None
                      values.append(value)
                  return ("tuple", tuple(values))
              return None

          seen = set()
          for key in blob_dict.keys:
              value = literal(key)
              if value is not None:
                  if value in seen:
                      raise SystemExit(f"duplicate blob_fixups key: {value!r}")
                  seen.add(value)

          print(
              "Duchamp integration invariants passed: "
              f"identity={desc_tuple}, product={desc.group('product')}"
          )
          PY

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f               \( -name '*.img' -o -name '*.apk' -o -name '*.so' \)               -not -path './.git/*' | grep -q .; then
            echo "Unexpected generated/proprietary binary found in device tree." >&2
            exit 1
          fi

          test ! -d products
          test ! -d manifests
          test ! -d scripts
