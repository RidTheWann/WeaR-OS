name: One-Time Branch Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete all non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in             "archive/pre-factory-reset-2026-10-03"             "factory-reset/final-3-2026-10-03"             "factory-reset/final-2026-10-03"             "factory-reset/2026-10-03"
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "$branch already absent"
            fi
          done

      - name: Remove one-time cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-branch-cleanup.yml
          git add -A
          git commit -m "chore: remove one-time branch cleanup workflow" || exit 0
          git push origin HEAD:main
